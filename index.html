<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FOOTBAZED</title>
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== ТЁМНАЯ ТЕМА ===== */
        :root {
            --bg: #0c0f1c;
            --card: #1a1e2c;
            --text: #e0e0e0;
            --accent: #3ccf91;
            --danger: #e74c3c;
            --border: #2f354a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.2rem; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--border); }
        
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .match-card {
            background: var(--card);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }
        .match-card.live { border-left: 4px solid var(--danger); }
        .match-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; color: #a0a8c0; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .team { text-align: center; width: 40%; }
        .team-name { font-weight: 600; font-size: 1rem; }
        .score { font-size: 1.5rem; font-weight: bold; background: #0f1320; padding: 8px 20px; border-radius: 10px; color: var(--accent); }
        .status-live { color: var(--danger); font-weight: bold; font-size: 0.75rem; }
        
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
        }
        .btn-secondary { background: var(--border); color: #fff; }
        .btn:hover { opacity: 0.9; }
        
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid var(--border);
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .nav-item.active { background: var(--accent); color: #000; }
        .nav-icon { font-size: 1.2rem; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.3rem; font-weight: bold; }
        .close-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
        
        label { display: block; margin: 15px 0 5px; font-size: 0.9rem; color: #a0a8c0; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #0f1320;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 10px;
            font-size: 1rem;
        }
        input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
        
        .profile-card { text-align: center; padding: 20px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--border); margin: 0 auto 15px; }
        .profile-name { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        
        .export-card { text-align: center; padding: 30px 20px; }
        .export-icon { font-size: 4rem; margin-bottom: 20px; }
        
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid var(--border);
            z-index: 2000;
            display: none;
        }
        .toast.show { display: block; }
        .toast.error { border-color: var(--danger); }
        .toast.success { border-color: var(--accent); }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="header">
        <div class="logo">⚽ FOOTBAZED</div>
        <div class="user-info" id="user-info">
            <span>Гость</span>
        </div>
    </div>

    <!-- КОНТЕНТ -->
    <div class="container" id="app-content">
        <div style="text-align:center; padding: 50px 0;">🔄 Загрузка...</div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav">
        <button class="nav-item active" onclick="navigate('matches')">
            <span class="nav-icon">📋</span>
            <span>Матчи</span>
        </button>
        <button class="nav-item" onclick="navigate('profile')">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
        <button class="nav-item" onclick="navigate('export')">
            <span class="nav-icon">💾</span>
            <span>Экспорт</span>
        </button>
    </div>

    <!-- МОДАЛКА ОЦЕНКИ -->
    <div class="modal" id="rate-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">⚽ Оценить матч</h2>
                <button class="close-btn" onclick="closeModal('rate-modal')">&times;</button>
            </div>
            <input type="hidden" id="modal-match-id">
            
            <label>Оценка матча (1-10)</label>
            <input type="number" id="rate-match" min="1" max="10" placeholder="7">
            
            <label>Комментарий</label>
            <textarea id="rate-comment" rows="3" placeholder="Ваши впечатления..."></textarea>
            
            <button class="btn" onclick="submitRating()">💾 Сохранить</button>
        </div>
    </div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================
        // ⚠️ ВСТАВЬ СВОИ КЛЮЧИ SUPABASE НИЖЕ!
        // ============================================
        const SUPABASE_URL = 'https://uukacnyvjvgmmhbkmfzf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1a2Fjbnl2anZnbW1oYmttZnpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDM3MzcsImV4cCI6MjA4NzA3OTczN30.hZIYkrWFqRwu0IciG2iF3TyP8WnVQcV1sFyjfeVUpRc';
        // ============================================

        // Инициализация Supabase (ИСПРАВЛЕНО: supabaseClient вместо supabase)
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error('Ошибка создания клиента Supabase:', e);
        }
        
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let currentUser = null;

        // ============================================
        // ЗАПУСК ПРИЛОЖЕНИЯ
        // ============================================
        async function init() {
            try {
                const user = tg.initDataUnsafe?.user;
                
                if (user && supabaseClient) {
                    // Режим Telegram
                    const { data, error } = await supabaseClient
                        .from('users')
                        .upsert({
                            id: user.id,
                            username: user.username,
                            display_name: user.first_name || user.username,
                            avatar_url: user.photo_url,
                            last_seen: new Date()
                        }, { onConflict: 'id' })
                        .select()
                        .single();
                    
                    if (data) {
                        currentUser = data;
                        document.getElementById('user-info').innerHTML = `
                            <img src="${user.photo_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.first_name)}" 
                                 class="user-avatar" alt="avatar">
                            <span>${escapeHtml(user.first_name || user.username)}</span>
                        `;
                    }
                } else {
                    // 🔧 РЕЖИМ ТЕСТА (без Telegram / если ошибка БД)
                    console.log('⚠️ Запуск в режиме теста (без Telegram)');
                    currentUser = {
                        id: 999999,
                        username: 'test_user',
                        display_name: 'Тестовый Пользователь',
                        avatar_url: null
                    };
                    document.getElementById('user-info').innerHTML = `<span>🧪 Тест</span>`;
                }
                
                navigate('matches');
            } catch (e) {
                console.error('Ошибка инициализации:', e);
                document.getElementById('app-content').innerHTML = `
                    <div style="text-align:center; padding: 50px; color: #e74c3c;">
                        <h3>❌ Ошибка загрузки</h3>
                        <p>${e.message}</p>
                        <p style="font-size: 0.8rem; color: #a0a8c0;">
                            Проверь консоль (F12) и ключи Supabase
                        </p>
                    </div>
                `;
            }
        }

        // ============================================
        // НАВИГАЦИЯ
        // ============================================
        async function navigate(page) {
            const content = document.getElementById('app-content');
            
            // Обновляем кнопки
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
            
            content.innerHTML = '<div style="text-align:center; padding: 50px 0;">🔄 Загрузка...</div>';
            
            if (page === 'matches') {
                await loadMatches();
            } else if (page === 'profile') {
                await loadProfile();
            } else if (page === 'export') {
                loadExport();
            }
        }

        // ============================================
        // ЗАГРУЗКА МАТЧЕЙ
        // ============================================
        async function loadMatches() {
            const content = document.getElementById('app-content');
            
            if (!supabaseClient) {
                content.innerHTML = '<div class="match-card">❌ Ошибка подключения к БД</div>';
                return;
            }

            const { data: matches, error } = await supabaseClient
                .from('matches')
                .select('*')
                .order('match_date', { ascending: false });
            
            if (error || !matches || matches.length === 0) {
                content.innerHTML = `
                    <div class="match-card">
                        <div style="text-align:center; padding: 30px;">
                            <div style="font-size: 3rem; margin-bottom: 10px;">📭</div>
                            <p>Матчей пока нет</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            matches.forEach(m => {
                const isLive = m.status === 'live';
                const statusBadge = isLive 
                    ? '<span class="status-live">● LIVE</span>' 
                    : `<span>${formatDate(m.match_date)}</span>`;
                
                html += `
                <div class="match-card ${isLive ? 'live' : ''}">
                    <div class="match-header">
                        <span>🏆 ${escapeHtml(m.league_name)}</span>
                        ${statusBadge}
                    </div>
                    <div class="teams">
                        <div class="team">
                            <div class="team-name">${escapeHtml(m.home_team_name)}</div>
                        </div>
                        <div class="score">${m.home_score ?? '-'} : ${m.away_score ?? '-'}</div>
                        <div class="team">
                            <div class="team-name">${escapeHtml(m.away_team_name)}</div>
                        </div>
                    </div>
                    <button class="btn" onclick="openRateModal(${m.id}, '${escapeHtml(m.home_team_name)}', '${escapeHtml(m.away_team_name)}')">
                        ⭐ Оценить матч
                    </button>
                </div>`;
            });
            
            content.innerHTML = html;
        }

        // ============================================
        // ПРОФИЛЬ
        // ============================================
        async function loadProfile() {
            const content = document.getElementById('app-content');
            
            if (!currentUser) {
                content.innerHTML = `
                    <div class="profile-card">
                        <div style="font-size: 3rem; margin-bottom: 20px;">👤</div>
                        <p>Вы не авторизованы</p>
                    </div>
                `;
                return;
            }
            
            content.innerHTML = `
                <div class="profile-card">
                    <div class="profile-name">${escapeHtml(currentUser.display_name)}</div>
                    <div style="color: #a0a8c0;">@${currentUser.username || 'no_username'}</div>
                </div>
            `;
        }

        // ============================================
        // ЭКСПОРТ
        // ============================================
        function loadExport() {
            const content = document.getElementById('app-content');
            
            content.innerHTML = `
                <div class="export-card">
                    <div class="export-icon">💾</div>
                    <h2>Экспорт данных</h2>
                    <button class="btn" onclick="exportData()">📥 Скачать JSON</button>
                </div>
            `;
        }

        async function exportData() {
            if (!currentUser || !supabaseClient) {
                showToast('Ошибка авторизации', 'error');
                return;
            }
            
            const { data, error } = await supabaseClient
                .from('ratings')
                .select('*')
                .eq('user_id', currentUser.id);
            
            if (error || !data) {
                showToast('Ошибка экспорта', 'error');
                return;
            }
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `footbazed_export.json`;
            a.click();
            
            showToast('✅ Данные экспортированы!', 'success');
        }

        // ============================================
        // МОДАЛКА ОЦЕНКИ
        // ============================================
        function openRateModal(matchId, homeTeam, awayTeam) {
            document.getElementById('modal-match-id').value = matchId;
            document.getElementById('rate-modal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        async function submitRating() {
            if (!currentUser || !supabaseClient) {
                showToast('Ошибка авторизации', 'error');
                return;
            }
            
            const matchId = document.getElementById('modal-match-id').value;
            const matchRating = document.getElementById('rate-match').value;
            const comment = document.getElementById('rate-comment').value;
            
            if (!matchRating) {
                showToast('Введите оценку', 'error');
                return;
            }
            
            const { error } = await supabaseClient.from('ratings').upsert({
                user_id: currentUser.id,
                match_id: matchId,
                match_rating: matchRating,
                comment: comment || null
            }, { onConflict: 'user_id,match_id' });
            
            if (error) {
                showToast('Ошибка: ' + error.message, 'error');
            } else {
                showToast('✅ Оценка сохранена!', 'success');
                closeModal('rate-modal');
                navigate('matches');
            }
        }

        // ============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', { 
                day: 'numeric', 
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Закрытие модального окна по клику вне
        document.getElementById('rate-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal('rate-modal');
        });

        // ============================================
        // ЗАПУСК
        // ============================================
        init();
    </script>
</body>
</html>
