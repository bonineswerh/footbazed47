<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FOOTBAZED ⚽</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-card: #252525;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --accent: #00d4aa;
      --accent-hover: #00b894;
      --danger: #ff4757;
      --warning: #ffa502;
      --success: #2ed573;
      --border: #333;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 0;
      padding-bottom: 80px;
    }

    /* 🖥 АДАПТИВ ДЛЯ ПК */
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-primary);
      min-height: 100vh;
      position: relative;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-primary);
      z-index: 100;
    }
    
    .logo {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: #000;
    }
    
    .filters {
      display: flex;
      gap: 8px;
      padding: 16px;
      overflow-x: auto;
    }
    
    .filter-btn {
      padding: 8px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-secondary);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }
    
    .match-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      margin: 0 16px 12px;
      border: 1px solid var(--border);
    }
    
    .match-league {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    
    .match-teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .team {
      flex: 1;
      text-align: center;
    }
    
    .team-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
    }
    
    .team-score {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .vs {
      color: var(--text-secondary);
      font-size: 14px;
      padding: 0 12px;
    }
    
    .match-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    
    .match-status {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-live {
      background: var(--danger);
      color: white;
      animation: pulse 2s infinite;
    }
    
    .status-finished {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }
    
    .status-scheduled {
      background: var(--accent);
      color: #000;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .match-actions {
      display: flex;
      gap: 8px;
    }
    
    .action-btn {
      flex: 1;
      padding: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .action-btn:hover { background: var(--border); }
    
    .action-btn.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .action-btn.primary:hover { background: var(--accent-hover); }
    
    /* МОДАЛКИ */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }
    
    .modal.active { display: flex; }
    
    .modal-content {
      background: var(--bg-card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .modal-title { font-size: 18px; font-weight: 600; }
    
    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
    }
    
    .rating-section { margin-bottom: 20px; }
    
    .rating-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    
    .rating-stars {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    
    .rating-star {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .rating-star.selected {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    
    .tags-input { margin-bottom: 20px; }
    
    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .tag-btn {
      padding: 6px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    
    .tag-btn.selected {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    
    .comment-input {
      width: 100%;
      padding: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      margin-bottom: 20px;
    }
    
    .save-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .save-btn:disabled {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: not-allowed;
    }
    
    /* ЧАТ */
    .chat-container {
      display: none;
      flex-direction: column;
      height: calc(100vh - 140px);
      padding: 16px;
    }
    
    .chat-container.active { display: flex; }
    
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .chat-back {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .chat-message {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 85%;
    }
    
    .chat-message.own {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
    }
    
    .chat-input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    
    .chat-input {
      flex: 1;
      padding: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text-primary);
    }
    
    .chat-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #000;
      cursor: pointer;
    }
    
    /* ПРОФИЛЬ И ДРУЗЬЯ */
    .profile-container, .friends-container {
      display: none;
      padding: 16px;
    }
    
    .profile-container.active, .friends-container.active {
      display: block;
    }
    
    .profile-header {
      text-align: center;
      padding: 20px;
      background: var(--bg-card);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #000;
      margin: 0 auto 12px;
    }
    
    .profile-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .friends-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .friend-card {
      background: var(--bg-card);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    
    .friend-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    
    /* НИЖНЕЕ МЕНЮ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 16px;
      gap: 8px;
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
    }
    
    .nav-item {
      flex: 1;
      padding: 10px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      border-radius: 10px;
    }
    
    .nav-item.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }
    
    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }
    
    /* УВЕДОМЛЕНИЯ */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--bg-card);
      padding: 12px 20px;
      border-radius: 10px;
      z-index: 2000;
      transition: transform 0.3s;
      max-width: 480px;
    }
    
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Заголовок -->
    <div class="header">
      <div class="logo">⚽ FOOTBAZED</div>
      <div class="user-info">
        <div class="avatar" id="userAvatar">U</div>
        <span id="userName">Гость</span>
      </div>
    </div>

    <!-- Вкладка: Матчи -->
    <div id="matchesView">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="live">🔴 LIVE</button>
        <button class="filter-btn" data-filter="finished">Завершённые</button>
        <button class="filter-btn" data-filter="scheduled">Предстоящие</button>

      <div id="matchesList">
        <div class="loading"><div class="spinner"></div>Загружаем...</div>
      </div>

    <!-- Вкладка: Чат (внутри матча) -->
    <div class="chat-container" id="chatContainer">

        <div class="chat-title" id="chatMatchTitle" style="font-weight: 600;"></div>

      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">

    <!-- Вкладка: Профиль -->
    <div class="profile-container" id="profileView">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">U</div>
        <h2 id="profileName">Имя</h2>
        <p id="profileUsername" style="color: var(--text-secondary);">@username</p>
        
        <div class="profile-stats">
          <div class="stat-item">
            <div class="stat-value" id="statMatches">0</div>
            <div class="stat-label">Оценок</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statAvg">0.0</div>
            <div class="stat-label">Средний</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statFriends">0</div>
            <div class="stat-label">Друзей</div>
          </div>
        </div>
      </div>
      
      <h3 style="margin-bottom: 12px;">Мои последние оценки</h3>
      <div id="profileRatings"></div>
    </div>

    <!-- Вкладка: Друзья -->
    <div class="friends-container" id="friendsView">
      <h2 style="margin-bottom: 16px;">Друзья</h2>
      <div class="friends-list" id="friendsList">
        <div class="empty-state">
          <div class="empty-icon">👥</div>
          <p>Пока нет друзей</p>
          <p style="font-size: 12px; margin-top: 8px;">Функция в разработке</p>
        </div>
      </div>
    </div>

    <!-- Модальное окно оценки -->
    <div class="modal" id="ratingModal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">Оценить матч</div>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        
        <div id="modalMatchInfo" style="margin-bottom: 20px; color: var(--text-secondary);"></div>
        
        <div class="rating-section">
          <div class="rating-label">Общее впечатление</div>
          <div class="rating-stars" id="matchRating"></div>
        </div>
        
        <div class="tags-input">
          <div class="rating-label">Теги</div>
          <div class="tags-list">
            <button class="tag-btn" data-tag="валидол">💊 Валидол</button>
            <button class="tag-btn" data-tag="судейский беспредел">⚖️ Судейский</button>
            <button class="tag-btn" data-tag="красивый футбол">✨ Красиво</button>
            <button class="tag-btn" data-tag="скучно">😴 Скучно</button>
          </div>
        </div>
        
        <textarea class="comment-input" id="commentInput" placeholder="Комментарий..." maxlength="500"></textarea>
        
        <button class="save-btn" id="saveRating">💾 Сохранить</button>
      </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
      <div class="nav-item active" data-view="matches">
        <span class="nav-icon">📋</span>
        Матчи
      </div>
      <div class="nav-item" data-view="friends">
        <span class="nav-icon">👥</span>
        Друзья
      </div>
      <div class="nav-item" data-view="profile">
        <span class="nav-icon">👤</span>
        Профиль
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uukacnyvjvgmmhbkmfzf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1a2Fjbnl2anZnbW1oYmttZnpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDM3MzcsImV4cCI6MjA4NzA3OTczN30.hZIYkrWFqRwu0IciG2iF3TyP8WnVQcV1sFyjfeVUpRc';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    const user = tg.initDataUnsafe?.user || {
      id: Date.now(),
      first_name: 'Гость',
      username: 'guest'
    };
    
    let currentUser = null;
    let currentMatch = null;
    let selectedRating = null;
    let selectedTags = [];
    let chatSubscription = null;
    
    async function init() {
      document.getElementById('userName').textContent = user.first_name || 'Гость';
      document.getElementById('userAvatar').textContent = (user.first_name?.[0] || 'U').toUpperCase();
      document.getElementById('profileName').textContent = user.first_name || 'Гость';
      document.getElementById('profileUsername').textContent = '@' + (user.username || 'guest');
      document.getElementById('profileAvatar').textContent = (user.first_name?.[0] || 'U').toUpperCase();
      
      await syncUser();
      await loadMatches();
      setupEventListeners();
      
      showToast('FOOTBAZED готов! ⚽', 'success');
    }
    
    async function syncUser() {
      try {
        // Проверяем, есть ли пользователь
        const {  existingUser } = await supabaseClient
          .from('users')
          .select('id')
          .eq('id', user.id)
          .single();
        
        if (!existingUser) {
          // Создаем нового
          const {  newUser, error } = await supabaseClient
            .from('users')
            .insert({
              id: user.id,
              username: user.username,
              display_name: user.first_name,
              last_seen: new Date().toISOString()
            })
            .select()
            .single();
          
          if (newUser) currentUser = newUser;
          if (error) console.error('Ошибка создания:', error);
        } else {
          // Обновляем last_seen
          await supabaseClient
            .from('users')
            .update({ last_seen: new Date().toISOString() })
            .eq('id', user.id);
          
          currentUser = existingUser;
        }
        
        console.log('✅ Пользователь:', currentUser);
      } catch (e) {
        console.error('❌ Ошибка синхронизации:', e);
      }
    }
    
    async function loadMatches(filter = 'all') {
      const list = document.getElementById('matchesList');
      list.innerHTML = '<div class="loading"><div class="spinner"></div>Загружаем...</div>';
      
      try {
        let query = supabaseClient.from('matches').select('*');
        
        if (filter === 'live') query = query.eq('status', 'live');
        else if (filter === 'finished') query = query.eq('status', 'finished');
        else if (filter === 'scheduled') query = query.eq('status', 'scheduled');
        
        query = query.order('match_date', { ascending: false });
        
        const {  matches, error } = await query;
        
        if (error) throw error;
        
        if (!matches || matches.length === 0) {
          list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>Матчей нет</p></div>';
          return;
        }
        
        list.innerHTML = matches.map(match => renderMatchCard(match)).join('');
        
      } catch (e) {
        console.error('❌ Ошибка:', e);
        list.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
      }
    }
    
    function renderMatchCard(match) {
      const date = new Date(match.match_date);
      const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      
      const statusText = { 'live': '🔴 LIVE', 'finished': 'Завершён', 'scheduled': 'Предстоит' }[match.status];
      const statusClass = { 'live': 'status-live', 'finished': 'status-finished', 'scheduled': 'status-scheduled' }[match.status];
      
      return `
        <div class="match-card" data-match-id="${match.id}">
          <div class="match-league">${match.league_name}</div>
          <div class="match-teams">
            <div class="team"><div class="team-name">${match.home_team_name}</div><div class="team-score">${match.home_score ?? '-'}</div></div>
            <div class="vs">VS</div>
            <div class="team"><div class="team-name">${match.away_team_name}</div><div class="team-score">${match.away_score ?? '-'}</div></div>
          </div>
          <div class="match-info">
            <span>📅 ${dateStr}</span>
            <span class="match-status ${statusClass}">${statusText}</span>
          </div>
          <div class="match-actions">
            ${match.status === 'finished' ? `<button class="action-btn primary" onclick="openRatingModal(${match.id})">⭐ Оценить</button>` : ''}
            <button class="action-btn" onclick="openChat(${match.id})">💬 Чат</button>
          </div>
        </div>
      `;
    }
    
    function openRatingModal(matchId) {
      const match = document.querySelector(`[data-match-id="${matchId}"]`);
      if (!match) return;
      
      currentMatch = { id: matchId };
      const teams = match.querySelectorAll('.team-name');
      document.getElementById('modalMatchInfo').textContent = `${teams[0]?.textContent} vs ${teams[1]?.textContent}`;
      
      const container = document.getElementById('matchRating');
      container.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const star = document.createElement('div');
        star.className = 'rating-star';
        star.textContent = i;
        star.onclick = () => selectRating(i, star);
        container.appendChild(star);
      }
      
      selectedRating = null;
      selectedTags = [];
      document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('commentInput').value = '';
      document.getElementById('ratingModal').classList.add('active');
    }
    
    function selectRating(value, el) {
      selectedRating = value;
      document.querySelectorAll('#matchRating .rating-star').forEach(s => {
        s.classList.toggle('selected', parseInt(s.textContent) <= value);
      });
    }
    
    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.onclick = function() {
        const tag = this.dataset.tag;
        this.classList.toggle('selected');
        if (selectedTags.includes(tag)) selectedTags = selectedTags.filter(t => t !== tag);
        else selectedTags.push(tag);
      };
    });
    
    document.getElementById('closeModal').onclick = () => {
      document.getElementById('ratingModal').classList.remove('active');
      currentMatch = null;
    };
    
    document.getElementById('saveRating').onclick = async function() {
      if (!selectedRating) { showToast('Выберите оценку 1-10', 'error'); return; }
      if (!currentUser) { showToast('Ошибка авторизации', 'error'); return; }
      
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Сохраняем...';
      
      try {
        let comment = document.getElementById('commentInput').value;
        // Простая цензура
        ['хер', 'пизд', 'бля', 'еб'].forEach(w => {
          comment = comment.replace(new RegExp(w, 'gi'), '*'.repeat(w.length));
        });
        
        const { error } = await supabaseClient
          .from('ratings')
          .upsert({
            user_id: currentUser.id,
            match_id: currentMatch.id,
            match_rating: selectedRating,
            comment: comment || null,
            tags: selectedTags.length ? selectedTags : null
          }, { onConflict: 'user_id,match_id' });
        
        if (error) {
          console.error('DB Error:', error);
          throw error;
        }
        
        showToast('✅ Оценка сохранена!', 'success');
        document.getElementById('ratingModal').classList.remove('active');
        loadMatches();
        loadProfileStats(); // Обновить профиль
        
      } catch (e) {
        console.error('❌ Ошибка:', e);
        showToast('Не удалось сохранить: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Сохранить';
      }
    };
    
    function openChat(matchId) {
      document.getElementById('matchesView').style.display = 'none';
      document.getElementById('chatContainer').classList.add('active');
      
      const match = document.querySelector(`[data-match-id="${matchId}"]`);
      if (match) {
        const teams = match.querySelectorAll('.team-name');
        document.getElementById('chatMatchTitle').textContent = `${teams[0]?.textContent} vs ${teams[1]?.textContent}`;
      }
      
      loadChatMessages(matchId);
      subscribeToChat(matchId);
    }
    
    async function loadChatMessages(matchId) {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '<div class="loading">Загружаем чат...</div>';
      
      const {  messages } = await supabaseClient
        .from('live_chat_messages')
        .select('*')
        .eq('match_id', matchId)
        .order('created_at', { ascending: true })
        .limit(50);
      
      if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="empty-state">👋 Начни обсуждение!</div>';
        return;
      }
      
      container.innerHTML = messages.map(msg => `
        <div class="chat-message ${msg.user_id === user.id ? 'own' : ''}">
          ${msg.user_id !== user.id ? `<div style="font-size:10px;opacity:0.7">@${msg.username||'Аноним'}</div>` : ''}
          <div>${msg.message}</div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }
    
    function subscribeToChat(matchId) {
      if (chatSubscription) supabaseClient.removeChannel(chatSubscription);
      
      chatSubscription = supabaseClient
        .channel(`chat:${matchId}`)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'live_chat_messages',
          filter: `match_id=eq.${matchId}`
        }, payload => {
          const container = document.getElementById('chatMessages');
          if (container.querySelector('.empty-state')) container.innerHTML = '';
          
          const msg = payload.new;
          container.insertAdjacentHTML('beforeend', `
            <div class="chat-message ${msg.user_id === user.id ? 'own' : ''}">
              ${msg.user_id !== user.id ? `<div style="font-size:10px;opacity:0.7">@${msg.username||'Аноним'}</div>` : ''}
              <div>${msg.message}</div>
            </div>
          `);
          container.scrollTop = container.scrollHeight;
        })
        .subscribe();
    }
    
    document.getElementById('chatSend').onclick = async function() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message || !currentUser) return;
      
      await supabaseClient.from('live_chat_messages').insert({
        match_id: currentMatch?.id || 1,
        user_id: currentUser.id,
        username: user.username || user.first_name,
        message: message
      });
      
      input.value = '';
    };
    
    document.getElementById('chatBack').onclick = function() {
      if (chatSubscription) { supabaseClient.removeChannel(chatSubscription); chatSubscription = null; }
      document.getElementById('chatContainer').classList.remove('active');
      document.getElementById('matchesView').style.display = 'block';
      currentMatch = null;
    };
    
    // Навигация
    function setupEventListeners() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = function() {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          loadMatches(this.dataset.filter);
        };
      });
      
      document.querySelectorAll('.nav-item').forEach(item => {
        item.onclick = function() {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          this.classList.add('active');
          
          const view = this.dataset.view;
          document.getElementById('matchesView').style.display = 'none';
          document.getElementById('chatContainer').classList.remove('active');
          document.getElementById('profileView').classList.remove('active');
          document.getElementById('friendsView').classList.remove('active');
          
          if (view === 'matches') {
            document.getElementById('matchesView').style.display = 'block';
            loadMatches();
          } else if (view === 'profile') {
            document.getElementById('profileView').classList.add('active');
            loadProfileStats();
          } else if (view === 'friends') {
            document.getElementById('friendsView').classList.add('active');
          }
        };
      });
      
      document.getElementById('ratingModal').onclick = function(e) {
        if (e.target === this) { this.classList.remove('active'); currentMatch = null; }
      };
    }
    
    async function loadProfileStats() {
      if (!currentUser) return;
      
      // Загружаем оценки
      const {  ratings } = await supabaseClient
        .from('ratings')
        .select('match_rating, matches(home_team_name, away_team_name)')
        .eq('user_id', currentUser.id);
      
      if (ratings) {
        document.getElementById('statMatches').textContent = ratings.length;
        
        const avg = ratings.length > 0 
          ? (ratings.reduce((sum, r) => sum + (r.match_rating || 0), 0) / ratings.length).toFixed(1)
          : '0.0';
        document.getElementById('statAvg').textContent = avg;
        
        // Последние оценки
        const container = document.getElementById('profileRatings');
        container.innerHTML = ratings.slice(0, 5).map(r => `
          <div style="background:var(--bg-card);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;">
            <span>${r.matches?.home_team_name || 'Матч'} vs ${r.matches?.away_team_name || ''}</span>
            <span style="color:var(--accent);font-weight:700">${r.match_rating}/10</span>
          </div>
        `).join('') || '<div class="empty-state">Пока нет оценок</div>';
      }
    }
    
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    if (tg.initData) init();
    else init();
  </script>
</body>
</html>
