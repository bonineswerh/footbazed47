name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  application:
    name: Static, unit and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e

  database:
    name: Clean database and SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - id: reset
        run: supabase db reset --local
      # CLI 2.114.0 uses this exact postgres-meta tag for type generation.
      # Its ECR pull ignores the setup action's GHCR mirror; shared runners hit
      # rate limits. Cache the official mirror under the expected image name.
      # https://github.com/supabase/cli/issues/5785
      - name: Prepare type generator from official mirror
        run: |
          docker pull ghcr.io/supabase/postgres-meta:v0.97.0
          docker tag ghcr.io/supabase/postgres-meta:v0.97.0 public.ecr.aws/supabase/postgres-meta:v0.97.0
      - name: Verify generated database types
        run: |
          cp types/database.ts /tmp/database.ts
          supabase gen types typescript --local --schema public > types/database.ts
          diff -u /tmp/database.ts types/database.ts
      - if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: supabase db lint --local --level error
      # The CLI installs its privileged lint extension before the test session
      # switches to PostgREST's preload configuration.
      # Match the hosted PostgREST session without granting superuser to tests.
      # This container and role configuration exist only in the disposable CI DB.
      - name: Enable production write guard for SQL tests
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: docker exec supabase_db_footbazed psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres SET session_preload_libraries = 'safeupdate';"
      - if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
